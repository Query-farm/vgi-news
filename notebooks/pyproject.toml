[project]
name = "vgi-news-notebooks"
version = "0.1.0"
description = "Capped news source mix through the released VGI worker"
requires-python = ">=3.13,<3.15"
dependencies = ["vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.48"]

[tool.ruff]
builtins = ["providers", "diagnostics_frame", "domains_frame", "chart_frame", "checks"]
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
